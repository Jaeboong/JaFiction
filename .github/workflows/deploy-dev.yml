name: Deploy to Dev (자소전.shop)

# develop 브랜치 push = dev/staging 환경 배포.
# Runner 바이너리는 backend Dockerfile 의 runner-bin stage 에서 빌드됨 (BUILD_RUNNER_BIN=true 기본값).

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to OCI (자소전.shop)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout (metadata only)
        uses: actions/checkout@v4

      - name: Validate secrets
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          if [ -z "$OCI_HOST" ]; then echo "::error::OCI_HOST secret is empty"; exit 1; fi
          if [ -z "$OCI_USER" ]; then echo "::error::OCI_USER secret is empty"; exit 1; fi
          if [ -z "$OCI_SSH_KEY" ]; then echo "::error::OCI_SSH_KEY secret is empty"; exit 1; fi

      - name: Prepare SSH key
        env:
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          printf '%s\n' "$OCI_SSH_KEY" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Deploy to dev stack (docker compose)
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
        run: |
          ssh -i /tmp/deploy_key \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${OCI_USER}@${OCI_HOST}" \
            'set -euo pipefail
            cd ~/project/Jasojeon
            echo "=== git fetch ==="
            git fetch origin develop
            echo "=== git reset --hard origin/develop ==="
            git reset --hard origin/develop
            echo "=== docker compose build ==="
            docker compose -f docker-compose.dev.yml --env-file .env.dev build --no-cache
            echo "=== docker compose up ==="
            docker compose -f docker-compose.dev.yml --env-file .env.dev up -d
            echo "=== cleanup ==="
            docker image prune -f
            echo "=== ps ==="
            docker compose -f docker-compose.dev.yml --env-file .env.dev ps
            echo "=== done ==="'

      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/deploy_key

      - name: Collect failure logs
        if: failure()
        env:
          OCI_HOST: ${{ secrets.OCI_HOST }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
        run: |
          printf '%s\n' "$OCI_SSH_KEY" > /tmp/deploy_key_fail
          chmod 600 /tmp/deploy_key_fail
          ssh -i /tmp/deploy_key_fail \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            "${OCI_USER}@${OCI_HOST}" \
            'cd ~/project/Jasojeon
            docker compose -f docker-compose.dev.yml --env-file .env.dev logs --tail 50 || true
            docker compose -f docker-compose.dev.yml --env-file .env.dev ps || true' \
            || echo "Failed to collect logs"
          rm -f /tmp/deploy_key_fail
